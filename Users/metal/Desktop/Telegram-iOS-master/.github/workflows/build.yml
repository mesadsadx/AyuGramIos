name: Build Ayugram iOS Signed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Certificates
        run: |
          echo "${{ secrets.P12_BASE64 }}" | base64 --decode > cert.p12
          echo "${{ secrets.MOBILEPROVISION_BASE64 }}" | base64 --decode > profile.mobileprovision
          
          security create-keychain -p "" build.keychain
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          
          security import cert.p12 -k build.keychain -P "${{ secrets.P12_PASSWORD }}" -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          
      - name: Install Bazel
        run: brew install bazel

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configure Telegram
        run: |
          cat <<EOF > build-system/config.json
          {
            "api_id": "${{ secrets.TELEGRAM_API_ID }}",
            "api_hash": "${{ secrets.TELEGRAM_API_HASH }}",
            "team_id": "${{ secrets.TEAM_ID }}",
            "bundle_id": "ph.ayugram.ios", 
            "app_center_id": ""
          }
          EOF
          
          python3 build-system/Make/Make.py \
            --override_config \
            --configuration release \
            prepare

      - name: Build IPA
        run: |
          python3 build-system/Make/Make.py \
            --configuration release \
            --build \
            --codesign YES \
            build

      - name: Package and Upload
        run: |
          if [ -f build/artifacts/release/Telegram.ipa ]; then
            mv build/artifacts/release/Telegram.ipa Ayugram.ipa
          else
            mkdir -p Payload
            cp -r build/artifacts/release/Telegram.app Payload/
            zip -qr Ayugram.ipa Payload/
          fi

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Ayugram-iOS-Signed
          path: Ayugram.ipa
